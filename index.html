nsplash.com/photo-1587829741301-dc798b83add3?auto=format&fit=crop&w=900&q=85',10011:'https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&w=900&q=85',10012:'https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=900&q=85',10013:'https://images.unsplash.com/photo-1516035069371-29a1b244cc32?auto=format&fit=crop&w=900&q=85',10014:'https://images.unsplash.com/photo-1594620302200-3a4f7e5aa2c3?auto=format&fit=crop&w=900&q=85',10015:'https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=900&q=85',10016:'https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?auto=format&fit=crop&w=900&q=85',10017:'https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?auto=format&fit=crop&w=900&q=85'};const all=S.ads.filter(a=>a.status==='approved').sort((a,b)=>b.date-a.date),pageSize=20,totalPages=Math.max(1,Math.ceil(all.length/pageSize));homePage=Math.min(homePage,totalPages);const list=all.slice((homePage-1)*pageSize,homePage*pageSize);return `<div class="home"><div class="home-shell"><section class="home-search"><h1>Rechercher une annonce</h1><div class="sub">Les bonnes trouvailles sont ici. À vous de choisir la prochaine.</div><form id="hsearch" class="home-search-form"><input class="field" name="q" placeholder="⌕  Que recherchez-vous ?"><select class="field" name="city"><option value="">⌖ Toute la France</option>${opts(S.cities)}</select><button class="btn p">Rechercher</button><button class="btn" type="button" data-act="go:ads">☷ Filtres</button></form><div class="home-options"><span>Affiner par</span><select aria-label="Budget"><option>Prix : Tous les budgets</option><option>Prix : les plus bas</option></select><select aria-label="État"><option>État : Tous les états</option></select><select aria-label="Vendeur"><option>Vendeur : Tous</option></select><label><input type="checkbox"> Livraison possible</label></div><div class="home-cats">${cats.map((c,i)=>`<button type="button" data-cat="${esc(c)}">${['⊞','▯','▣','♧','⌂','♧','♢','♙'][i]} &nbsp;${c}</button>`).join('')}</div></section><section class="discover"><div class="discover-head"><div><h2>Les annonces à découvrir</h2><p>${all.length} annonce(s) · Toutes les catégories · France</p></div><div class="home-tools"><label>Trier par</label><select id="homeSortList"><option value="recent">Les plus récentes</option><option value="low">Prix croissant</option><option value="high">Prix décroissant</option></select><button class="btn s" aria-label="Affichage en grille">▦</button><button class="btn s" aria-label="Affichage en liste">☷</button></div></div><div class="home-cards">${list.map((a,i)=>`<article class="home-card"><div class="home-photo" style="background-image:url('${AD_PHOTO[a.id]||AD_PHOTO[1]}')"><span class="badge">Très bon état</span><button class="home-fav" type="button" data-favorite="${a.id}" aria-label="Ajouter aux favoris" aria-pressed="${isFavorite(a.id)}">${isFavorite(a.id)?'♥':'♡'}</button></div><div class="home-card-body"><span class="home-cat">${IC[a.category]||'▣'} &nbsp;${esc(a.category)}</span><h3>${esc(a.title)}</h3><div class="home-price">${dh(a.price)}</div><div class="home-meta">⌖ ${esc(a.city)} · ${dt(a.date)}</div><div class="home-card-foot"><span>${dt(a.date)} · VENDO</span><button type="button" data-act="ad:${a.id}">Consulter ↗</button></div></div></article>`).join('')||'<div class="home-empty">Aucune annonce pour le moment.</div>'}</div>${totalPages>1?`<nav class="home-pagination" aria-label="Pagination des annonces">${homePage>1?`<button type="button" data-home-page="${homePage-1}">‹ Précédent</button>`:''}${Array.from({length:totalPages},(_,i)=>`<button type="button" data-home-page="${i+1}" class="${homePage===i+1?'active':''}">${i+1}</button>`).join('')}${homePage<totalPages?`<button type="button" data-home-page="${homePage+1}">Suivant ›</button>`:''}</nav>`:''}<div class="home-footer"><div><b>VENDO · Ton marché, ton choix</b><br>© 2026 VENDO. De belles opportunités, des choix faits du cœur.</div><div class="home-footer-links"><span>Centre d’aide</span><span>Conditions d’utilisation</span><span>Confidentialité</span></div></div></section></div></div>`}function ads(){return `<h1>Toutes les annonces</h1><div class="sub">Recherchez et filtrez par catégorie, ville, prix et date.</div><div class="filters"><input class="field q" id="fq" placeholder="⌕ Rechercher..." value="${esc(F.q)}"><select class="field" id="fcat"><option value="">Catégories</option>${opts(S.cats,F.cat)}</select><select class="field" id="fcity"><option value="">Villes</option>${opts(S.cities,F.city)}</select><input class="field" id="fmin" type="number" min="0" placeholder="Prix min" value="${esc(F.min)}"><input class="field" id="fmax" type="number" min="0" placeholder="Prix max" value="${esc(F.max)}"><select class="field" id="fsort"><option value="recent" ${F.sort==='recent'?'selected':''}>Plus récentes</option><option value="low" ${F.sort==='low'?'selected':''}>Prix croissant</option><option value="high" ${F.sort==='high'?'selected':''}>Prix décroissant</option></select><button class="btn" data-act="clear">Effacer</button></div><div class="cards" id="list"></div>`}
function list(){const a=visible();$('#list').innerHTML=a.length?a.map(x=>card(x)).join(''):'<div class="empty">Aucune annonce trouvée. Essayez une autre recherche.</div>'}
function detail(){const a=S.ads.find(x=>x.id===P);if(!a)return '<div class="empty">Annonce introuvable.</div>';if(a.status!=='approved'&&!(me&&(isAdmin()||me.email===a.owner)))return '<div class="empty">Cette annonce n’est pas encore validée.</div>';
const can=!isAdmin()&&!(me&&me.email===a.owner)&&a.status==='approved';
return `<button class="btn" data-act="go:ads">← Retour</button><div class="box" style="margin-top:14px"><div class="thumb" style="height:150px;font-size:70px">${IC[a.category]||'🏷️'}</div><span class="badge" style="margin-top:12px">${esc(a.category)}${a.status==='pending'?' · En attente de validation':''}</span><h1>${esc(a.title)}</h1><div class="price">${dh(a.price)}</div><p class="meta">⌖ ${esc(a.city)} · Par ${esc(a.seller)} · ${dt(a.date)}</p><p style="line-height:1.6">${esc(a.description)}</p><div class="foot">${isAdmin()&&a.status==='pending'?`<button class="btn p" data-act="approve:${a.id}">Valider l’annonce</button>`:''}${me&&(isAdmin()||me.email===a.owner)?`<button class="btn d" data-act="del:${a.id}">Supprimer</button>`:''}</div></div>
${can?`<div class="box" style="margin-top:14px"><h2>Contacter l’annonceur</h2><form id="msgForm">${me?'':`<div class="g2"><div><label class="label">Votre nom</label><input class="field" name="name" required></div><div><label class="label">Votre email</label><input class="field" name="email" type="email" required></div></div>`}<label class="label">Message</label><textarea class="field" name="text" rows="4" required placeholder="Bonjour, votre annonce est-elle toujours disponible ?"></textarea><button class="btn p" style="margin-top:12px">Envoyer le message</button></form></div>`:''}`}
function auth(){const su=mode==='signup';return `<div class="box auth"><span class="eyebrow">BIENVENUE CHEZ VENDO</span><h2>${su?'Créez votre compte.':'Connectez-vous.'}</h2><p class="sub">${su?'Votre prochaine trouvaille commence ici. Rejoignez le marché.':'Retrouvez votre espace et vos annonces.'}</p>${note?`<div class="notice">${note}</div>`:''}<form id="authForm">${su?`<label class="label">Quel espace est fait pour vous ?</label><div class="roles"><button type="button" class="role on" data-act="role:client"><span>▣</span> <b>Espace Annonceur</b><small>Déposez des annonces et contactez les annonceurs.</small></button><button type="button" class="role" data-act="adminlogin"><span>▤</span> <b>Espace Administrateur</b><small>Réservé : connexion avec un compte administrateur.</small></button></div><label class="label">Nom complet</label><input class="field" name="name" placeholder="Votre prénom et votre nom" required>`:''}<div class="g2"><div><label class="label">Email</label><input class="field" name="email" type="email" placeholder="vous@exemple.ma" required></div>${su?`<div><label class="label">Téléphone</label><input class="field" name="phone" placeholder="Ex. : 06 12 34 56 78"></div>`:''}<div><label class="label">Mot de passe</label><input class="field" name="password" type="password" required minlength="8"></div>${su?`<div><label class="label">Confirmer le mot de passe</label><input class="field" name="confirm" type="password" required></div>`:''}</div>${su?'<p class="hint">Au moins 8 caractères, une majuscule et un chiffre.</p>':''}<button class="btn p" style="width:100%;margin-top:14px">${su?'S’inscrire →':'Se connecter →'}</button></form><p class="sub" style="text-align:center">${su?'Déjà inscrit ?':'Pas encore de compte ?'} <a href="#" data-act="${su?'login':'signup'}">${su?'Se connecter':'S’inscrire'}</a></p></div>`}
const adForm=()=>`<div class="box"><h2>Déposer une annonce</h2><form id="adForm"><label class="label">Titre</label><input class="field" name="title" required maxlength="90"><label class="label">Description</label><textarea class="field" name="description" rows="4" required></textarea><div class="g2"><div><label class="label">Prix (DH)</label><input class="field" name="price" type="number" min="0" required></div><div><label class="label">Catégorie</label><select class="field" name="category">${opts(S.cats)}</select></div><div class="wide"><label class="label">Ville</label><select class="field" name="city">${opts(S.cities)}</select></div></div><p class="hint">${isAdmin()?'Publiée immédiatement (administrateur).':'Votre annonce sera visible après validation par l’administrateur.'}</p><button class="btn p" style="margin-top:10px">${isAdmin()?'Publier':'Envoyer pour validation'}</button> <button type="button" class="btn" data-act="go:${isAdmin()?'admin':'dash'}">Annuler</button></form></div>`;
function dash(){if(!me||isAdmin())return auth();const mine=S.ads.filter(a=>a.owner===me.email),inbox=S.msgs.filter(m=>m.to===me.email);
return `<div class="row" style="border:0"><div><h1>Bonjour, ${esc(me.name)} !</h1><div class="sub">Espace annonceur</div></div><button class="btn p" data-act="go:post">＋ Déposer une annonce</button></div><div class="tabs"><button class="btn ${tab==='ads'?'on':''}" data-act="tab:ads">Mes annonces (${mine.length})</button><button class="btn ${tab==='msgs'?'on':''}" data-act="tab:msgs">Messages (${inbox.length})</button></div>`+
(tab==='ads'?`<div class="cards">${mine.map(a=>card(a)).join('')||'<div class="empty">Vous n’avez pas encore d’annonce.</div>'}</div>`:`<div class="box">${inbox.map(m=>{const a=S.ads.find(x=>x.id===m.adId);return `<div class="row"><div><b>${esc(m.name)}</b> (${esc(m.email)}) · <span class="meta">${dt(m.date)}</span><br><span class="meta">À propos de : ${esc(a?a.title:'annonce supprimée')}</span><p>${esc(m.text)}</p></div><a class="btn s" href="mailto:${esc(m.email)}">Répondre</a></div>`}).join('')||'<div class="sub">Aucun message reçu.</div>'}</div>`)}
function admin(){if(!isAdmin())return auth();const pend=S.ads.filter(a=>a.status==='pending');
const chips=(k,arr)=>arr.map(x=>`<button class="btn s" data-act="rm${k}:${encodeURIComponent(x)}">${esc(x)} ✕</button>`).join('');
return `<div class="row" style="border:0"><div><h1>Administration</h1><div class="sub">${S.users.length-1} membre(s) · ${S.ads.length} annonce(s) · ${pend.length} à valider</div></div><button class="btn p" data-act="go:post">＋ Déposer une annonce</button></div><div class="tabs">${[['pending','À valider'],['all','Annonces'],['cats','Catégories'],['cities','Villes'],['users','Membres']].map(t=>`<button class="btn ${atab===t[0]?'on':''}" data-act="atab:${t[0]}">${t[1]}</button>`).join('')}</div>`+
(atab==='pending'?`<div class="cards">${pend.map(a=>card(a,`<button class="btn s p" data-act="approve:${a.id}">Valider</button>`)).join('')||'<div class="empty">Aucune annonce en attente.</div>'}</div>`:
atab==='all'?`<div class="cards">${S.ads.map(a=>card(a)).join('')||'<div class="empty">Aucune annonce.</div>'}</div>`:
atab==='cats'?`<div class="box"><form id="catForm" class="searchbar"><input class="field" name="item" placeholder="Nouvelle catégorie" required><button class="btn p">Ajouter</button></form><div class="chips">${chips('cat',S.cats)}</div></div>`:
atab==='cities'?`<div class="box"><form id="cityForm" class="searchbar"><input class="field" name="item" placeholder="Nouvelle ville" required><button class="btn p">Ajouter</button></form><div class="chips">${chips('city',S.cities)}</div></div>`:
`<div class="box">${S.users.filter(u=>u.role!=='admin').map(u=>`<div class="row"><span><b>${esc(u.name)}</b> · ${esc(u.email)} ${esc(u.phone||'')}</span><button class="btn s d" data-act="rmuser:${encodeURIComponent(u.email)}">Supprimer le membre</button></div>`).join('')||'<div class="sub">Aucun membre inscrit.</div>'}</div>`)}
function render(){navbar();const m=$('#view');
m.innerHTML=({home,ads,ad:detail,auth,dash,admin,post:()=>me?adForm():auth()})[V==='detail'?'ad':V]();
if(V==='ads')list()}
const acts={
go:a=>go(a),login:()=>{mode='login';note='';go('auth')},signup:()=>{mode='signup';note='';go('auth')},
adminlogin:()=>{mode='login';note='Espace Administrateur : connectez-vous avec le compte administrateur (démo : admin@vendo.ma / Admin1234).';go('auth')},
ad:a=>go('ad',+a),category:a=>{const c=decodeURIComponent(a);F.cat=c==='Tout'?'':c;go('ads')},tab:a=>{tab=a;render()},atab:a=>{atab=a;render()},role:()=>{},
logout:()=>{me=null;st.d('vendo_me');toast('Vous êtes déconnecté.');go('home')},
clear:()=>{F={q:'',cat:'',city:'',min:'',max:'',sort:'recent'};render()},
approve:a=>{S.ads.find(x=>x.id==a).status='approved';save();toast('Annonce validée.');render()},
del:a=>{if(!confirm('Supprimer cette annonce ?'))return;S.ads=S.ads.filter(x=>x.id!=a);save();toast('Annonce supprimée.');if(V==='ad')go(me?(isAdmin()?'admin':'dash'):'ads');else render()},
rmcat:a=>{a=decodeURIComponent(a);if(!confirm('Supprimer la catégorie '+a+' ?'))return;S.cats=S.cats.filter(x=>x!==a);save();render()},
rmcity:a=>{a=decodeURIComponent(a);if(!confirm('Supprimer la ville '+a+' ?'))return;S.cities=S.cities.filter(x=>x!==a);save();render()},
rmuser:a=>{a=decodeURIComponent(a);if(!confirm('Supprimer ce membre et ses annonces ?'))return;S.users=S.users.filter(u=>u.email!==a);S.ads=S.ads.filter(x=>x.owner!==a);save();toast('Membre supprimé.');render()}};
document.addEventListener('click',e=>{const fav=e.target.closest('[data-favorite]');if(fav){e.preventDefault();const id=Number(fav.dataset.favorite),ids=getFavorites(),on=!ids.includes(id),next=on?[...ids,id]:ids.filter(x=>x!==id);st.s('vendo_favorites',JSON.stringify(next));fav.classList.toggle('active',on);fav.textContent=on?'♥':'♡';fav.setAttribute('aria-pressed',String(on));fav.setAttribute('aria-label',on?'Retirer des favoris':'Ajouter aux favoris');return}const hp=e.target.closest('[data-home-page]');if(hp){const u=new URL('pagedaccuille.html',location.href);u.searchParams.set('p',hp.dataset.homePage);location.href=u.href;return}const c=e.target.closest('[data-cat]');if(c){e.preventDefault();const map={'Tout':'','Téléphones':'Autre','Informatique':'Informatique','Vêtements':'Mode','Maison & meubles':'Maison','Voitures':'Autre','Chaussures':'Mode','Accessoires':'Autre'};F.cat=map[c.dataset.cat]||'';go('ads');return}const t=e.target.closest('[data-act]');if(!t)return;e.preventDefault();const[n,...r]=t.dataset.act.split(':');(acts[n]||(()=>{}))(r.join(':'))});
document.addEventListener('input',e=>{const m={fq:'q',fcat:'cat',fcity:'city',fmin:'min',fmax:'max',fsort:'sort'}[e.target.id];if(m){F[m]=e.target.value;list()}});
document.addEventListener('submit',e=>{e.preventDefault();const id=e.target.id,f=new FormData(e.target),g=k=>(f.get(k)||'').toString().trim();
if(id==='hsearch'){F.q=g('q');F.city=g('city');go('ads')}
else if(id==='authForm'){const email=g('email').toLowerCase(),pw=f.get('password');
if(mode==='signup'){if(pw!==f.get('confirm'))return toast('Les mots de passe ne correspondent pas.');if(!/[A-Z]/.test(pw)||!/[0-9]/.test(pw)||pw.length<8)return toast('Mot de passe : 8 caractères, une majuscule et un chiffre.');if(S.users.some(u=>u.email===email))return toast('Cette adresse email est déjà inscrite.');
const u={name:g('name'),email,phone:g('phone'),password:pw,role:'client'};S.users.push(u);save();me={name:u.name,email,role:'client'};toast('Compte créé. Bienvenue !')}
else{const u=S.users.find(u=>u.email===email&&u.password===pw);if(!u)return toast('Email ou mot de passe incorrect.');me={name:u.name,email:u.email,role:u.role};toast('Connexion réussie.')}
st.s('vendo_me',JSON.stringify(me));go(isAdmin()?'admin':'dash')}
else if(id==='adForm'){S.ads.push({id:Date.now(),title:g('title'),description:g('description'),price:+f.get('price'),category:g('category'),city:g('city'),seller:me.name,owner:me.email,status:isAdmin()?'approved':'pending',date:Date.now()});save();toast(isAdmin()?'Annonce publiée.':'Annonce envoyée pour validation.');if(!isAdmin())tab='ads';go(isAdmin()?'admin':'dash')}
else if(id==='msgForm'){const a=S.ads.find(x=>x.id===P);S.msgs.push({id:Date.now(),adId:a.id,to:a.owner,name:me?me.name:g('name'),email:me?me.email:g('email'),text:g('text'),date:Date.now()});save();e.target.reset();toast('Message envoyé à l’annonceur.')}
else if(id==='catForm'||id==='cityForm'){const k=id==='catForm'?'cats':'cities',v=g('item');if(v&&!S[k].includes(v)){S[k].push(v);save();toast('Ajouté.')}render()}});
render();
</script></body></html>
